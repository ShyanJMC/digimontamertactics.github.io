<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Tamer Tactics</title>
  <desc id="dsc">Formato fan-made para el Digimon Card Game 2020+, version 0.9.0, congelada para mesa real.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1730"/>
      <stop offset="1" stop-color="#152441"/>
    </linearGradient>
    <linearGradient id="ora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC96F"/>
      <stop offset="1" stop-color="#F26B1D"/>
    </linearGradient>
    <pattern id="hex" width="56" height="48" patternUnits="userSpaceOnUse">
      <path d="M14 0 L42 0 L56 24 L42 48 L14 48 L0 24 Z" fill="none" stroke="#2E4C7E" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#hex)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#ora)"/>
  <rect x="0" y="354" width="1280" height="6" fill="url(#ora)"/>

  <g fill="#3FC8DE" opacity="0.8">
    <rect x="72" y="70" width="6" height="20"/><rect x="84" y="70" width="12" height="20"/>
    <rect x="102" y="70" width="6" height="20"/><rect x="114" y="70" width="16" height="20"/>
    <rect x="136" y="70" width="6" height="20"/><rect x="148" y="70" width="10" height="20"/>
    <rect x="164" y="70" width="6" height="20"/>
  </g>

  <text x="70" y="188" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="3" fill="url(#ora)">TAMER TACTICS</text>
  <text x="74" y="230" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="6" fill="#3FC8DE">FORMATO FAN-MADE  ·  DIGIMON CARD GAME 2020+</text>
  <text x="74" y="276" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="400" fill="#9DB2D6">Cada Tamer lidera un grupo.  Un ataque a la seguridad por grupo.  Evolucionar es la unica defensa real.</text>

  <g transform="translate(1058,164)">
    <path d="M0 -78 L66 -39 L66 39 L0 78 L-66 39 L-66 -39 Z" fill="#1E3357" stroke="#F26B1D" stroke-width="3"/>
    <text x="0" y="2" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="33" font-weight="800" fill="#FFC96F">v0.9.0</text>
    <text x="0" y="30" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#9DB2D6">CONGELADA</text>
    <path d="M104 -40 L128 -26 L128 2 L104 16 L80 2 L80 -26 Z" fill="#152441" stroke="#3FC8DE" stroke-width="2"/>
    <path d="M100 44 L122 57 L122 83 L100 96 L78 83 L78 57 Z" fill="#152441" stroke="#69D95B" stroke-width="2"/>
  </g>
</svg>
