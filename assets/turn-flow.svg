<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">El turno en Tamer Tactics</title>
  <desc id="dsc">Preparacion con el Tamer inicial ya en batalla, y las fases del turno estandar con los dos puntos que el formato modifica: la breeding phase y la main phase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101E3A"/><stop offset="1" stop-color="#0C1730"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="5" fill="#F26B1D"/>
  <text x="40" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="#EAF1FF">EL TURNO, PASO A PASO</text>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <!-- SETUP -->
    <rect x="40" y="70" width="150" height="70" rx="10" fill="#12324A" stroke="#3FC8DE" stroke-width="2"/>
    <text x="115" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#3FC8DE">SETUP</text>
    <text x="115" y="118" text-anchor="middle" font-size="10" fill="#9DB2D6">Tamer inicial en</text>
    <text x="115" y="132" text-anchor="middle" font-size="10" fill="#9DB2D6">batalla + [On Play]</text>

    <text x="205" y="112" font-size="20" fill="#2E4C7E">&#9656;</text>

    <!-- Unsuspend -->
    <rect x="228" y="78" width="120" height="54" rx="9" fill="#1A2C4E" stroke="#2E4C7E" stroke-width="2"/>
    <text x="288" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#C6D5F0">Unsuspend</text>
    <text x="288" y="120" text-anchor="middle" font-size="10" fill="#8FA6CC">enderezas todo</text>

    <text x="352" y="112" font-size="20" fill="#2E4C7E">&#9656;</text>

    <!-- Draw -->
    <rect x="374" y="78" width="110" height="54" rx="9" fill="#1A2C4E" stroke="#2E4C7E" stroke-width="2"/>
    <text x="429" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#C6D5F0">Draw</text>
    <text x="429" y="120" text-anchor="middle" font-size="10" fill="#8FA6CC">robas 1</text>

    <text x="488" y="112" font-size="20" fill="#2E4C7E">&#9656;</text>

    <!-- Breeding (flagged) -->
    <rect x="510" y="70" width="200" height="70" rx="10" fill="#20365D" stroke="#F26B1D" stroke-width="2.5"/>
    <circle cx="524" cy="84" r="5" fill="#F26B1D"/>
    <text x="614" y="96" text-anchor="middle" font-size="13" font-weight="800" fill="#FFC96F">Breeding</text>
    <text x="614" y="114" text-anchor="middle" font-size="9.5" fill="#C6D5F0">eclosionar / mover / nada</text>
    <text x="614" y="128" text-anchor="middle" font-size="9.5" fill="#C6D5F0">2&#186;+ Tamer a batalla: 2 memoria</text>

    <text x="714" y="112" font-size="20" fill="#2E4C7E">&#9656;</text>

    <!-- Main (flagged) -->
    <rect x="736" y="70" width="300" height="70" rx="10" fill="#20365D" stroke="#F26B1D" stroke-width="2.5"/>
    <circle cx="750" cy="84" r="5" fill="#F26B1D"/>
    <text x="886" y="94" text-anchor="middle" font-size="13" font-weight="800" fill="#FFC96F">Main Phase</text>
    <text x="886" y="112" text-anchor="middle" font-size="9.5" fill="#C6D5F0">jugar / evolucionar / linkear / atacar</text>
    <text x="886" y="126" text-anchor="middle" font-size="9.5" fill="#C6D5F0">seguridad: 1/grupo  ·  Digimon: 3(+1)  ·  proteges 1 carta</text>

    <text x="1040" y="112" font-size="20" fill="#2E4C7E">&#9656;</text>

    <!-- end -->
    <rect x="1062" y="78" width="110" height="54" rx="9" fill="#12324A" stroke="#69D95B" stroke-width="2"/>
    <text x="1117" y="100" text-anchor="middle" font-size="11" font-weight="800" fill="#69D95B">FIN</text>
    <text x="1117" y="118" text-anchor="middle" font-size="9" fill="#9DB2D6">memoria al rival</text>
  </g>

  <line x1="40" y1="185" x2="1160" y2="185" stroke="#2E4C7E" stroke-width="1"/>
  <text x="40" y="212" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#EAF1FF"><tspan fill="#F26B1D" font-weight="800">&#9679;</tspan>  Solo dos fases cambian respecto al juego oficial: <tspan font-weight="700">Breeding</tspan> (costo del 2&#186;+ Tamer) y <tspan font-weight="700">Main</tspan> (limites de ataque + proteccion).</text>
  <text x="40" y="238" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#8FA6CC">Todo lo demas &#8212; memory gauge, counter timing, chequeos de seguridad, batallas por DP &#8212; sigue igual que en el Comprehensive Rules v4.2.</text>
  <text x="40" y="264" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#8FA6CC">El fin de turno se dispara solo: en cuanto la memoria queda del lado del rival y no hay nada pendiente.</text>
</svg>
